<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {

    font-family: 'Hiragino Mincho ProN', 'Noto Serif JP', 'Yu Mincho', serif;
    min-height: 100vh;
    padding: 20px 14px 40px;
    user-select: none;
}
.container { max-width: 720px; margin: 0 auto; }

.topbar {
    display: flex; justify-content: space-between;
    color: #a78bfa; font-size: 12px; margin-bottom: 12px;
}
.topbar a { color: #a78bfa; text-decoration: none; font-family: system-ui, sans-serif; }

.brand {
    text-align: center;
    margin-bottom: 18px;
}
.brand-title {
    font-size: 32px;
    font-weight: 700;
    background: linear-gradient(135deg, #fbbf24, #f59e0b, #fbbf24);

}
.brand-sub { color: #a78bfa; font-size: 12px; margin-top: 6px; letter-spacing: 2px; }

.controls {
    background: rgba(30,27,75,0.6);
    border: 1px solid rgba(167,139,250,0.3);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    backdrop-filter: blur(10px);
}

.search-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}
input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(167,139,250,0.4);
    color: #fff;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
}
input[type="text"]:focus { border-color: #fbbf24; }

.actions-row {
    display: flex; gap: 6px;
    flex-wrap: wrap;
}
.act {
    flex: 1;
    min-width: 80px;
    padding: 10px 8px;
    background: rgba(167,139,250,0.15);
    border: 1px solid rgba(167,139,250,0.4);
    color: #e6e3f0;
    border-radius: 8px;
    font-family: 'Hiragino Maru Gothic ProN', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}
.act:hover { background: rgba(167,139,250,0.3); }
.act.gold {
    background: linear-gradient(135deg, rgba(251,191,36,0.25), rgba(245,158,11,0.25));
    border-color: rgba(251,191,36,0.6);
    color: #fbbf24;
}

.filters {
    display: flex;
    gap: 4px;
    margin-bottom: 12px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
}
.filters::-webkit-scrollbar { display: none; }
.filt {
    flex-shrink: 0;
    padding: 6px 12px;
    background: rgba(30,27,75,0.6);
    border: 1px solid rgba(167,139,250,0.3);
    border-radius: 16px;
    color: #a78bfa;
    font-size: 12px;
    font-family: system-ui, sans-serif;
    cursor: pointer;
    white-space: nowrap;
}
.filt.active {
    background: rgba(251,191,36,0.2);
    border-color: #fbbf24;
    color: #fbbf24;
}

/* Card grid */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 6px;
}

.card {
    aspect-ratio: 2 / 3;
    background: linear-gradient(160deg, var(--c1, #312e81), var(--c2, #1e1b4b));
    border: 1px solid rgba(251,191,36,0.4);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 6px 4px;
    cursor: pointer;
    position: relative;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    overflow: hidden;
    text-align: center;
}
.card:hover { transform: translateY(-3px); border-color: #fbbf24; box-shadow: 0 6px 20px rgba(251,191,36,0.3); }
.card .em { font-size: 32px; margin-bottom: 2px; line-height: 1; }
.card .nm {
    font-size: 11px;
    font-weight: 700;
    line-height: 1.2;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
}
.card .no {
    position: absolute;
    top: 4px; left: 4px;
    color: rgba(251,191,36,0.7);
    font-size: 9px;
    font-weight: 700;
}
[data-st="major"] { --c1: #4c1d95; --c2: #1e1b4b; }
[data-st="wands"]  { --c1: #7f1d1d; --c2: #431407; }
[data-st="cups"]   { --c1: #1e3a8a; --c2: #0c4a6e; }
[data-st="swords"] { --c1: #374151; --c2: #111827; }
[data-st="pents"]  { --c1: #14532d; --c2: #052e16; }

/* Drawn cards (for spread) */
.spread-area {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 12px;
}
.draw-slot {
    width: 100%;
    max-width: 220px;
    text-align: center;
}
.draw-slot .pos-label {
    font-size: 11px;
    color: #fbbf24;
    margin-bottom: 4px;
    letter-spacing: 2px;
    font-family: system-ui, sans-serif;
}
.draw-card {
    aspect-ratio: 2 / 3;
    border-radius: 10px;
    border: 2px solid rgba(251,191,36,0.5);
    background: linear-gradient(160deg, var(--c1, #312e81), var(--c2, #1e1b4b));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px;
    cursor: pointer;
    text-align: center;
    position: relative;
}
.draw-card.reversed { transform: rotate(180deg); }
.draw-card.reversed .nm-jp, .draw-card.reversed .em, .draw-card.reversed .no, .draw-card.reversed .rev-tag { transform: rotate(180deg); }
.draw-card .em { font-size: 56px; margin-bottom: 4px; }
.draw-card .nm-jp { font-size: 16px; font-weight: 800; color: #fff; }
.draw-card .nm-en { font-size: 10px; color: rgba(255,255,255,0.7); margin-top: 2px; }
.draw-card .rev-tag {
    position: absolute;
    top: 4px; right: 4px;
    background: #f87171;
    color: #fff;
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 8px;
    font-family: system-ui, sans-serif;
    font-weight: 800;
    letter-spacing: 1px;
}
.spread-mode .grid { display: none; }
.spread-mode .filters { display: none; }
.spread-mode .search-row { display: none; }

/* Detail modal */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    display: none;
    align-items: flex-end;
    justify-content: center;
    backdrop-filter: blur(8px);
}
.modal.show { display: flex; animation: fadein 0.2s; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

.modal-inner {
    background: linear-gradient(160deg, #1e1b4b, #0f0a1f);
    border: 1px solid rgba(251,191,36,0.4);
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 560px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 18px 18px 32px;
    animation: slideup 0.3s cubic-bezier(.2,.7,.3,1);
}
@keyframes slideup { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal-close {
    position: sticky;
    top: 0;
    margin-left: auto;
    margin-bottom: -32px;
    width: 36px; height: 36px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(167,139,250,0.4);
    color: #fff;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
}

.detail-card {
    aspect-ratio: 2 / 3;
    max-width: 200px;
    margin: 0 auto 16px;
    border-radius: 12px;
    border: 2px solid rgba(251,191,36,0.5);
    background: linear-gradient(160deg, var(--c1, #312e81), var(--c2, #1e1b4b));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    text-align: center;
    position: relative;
}
.detail-card.reversed { transform: rotate(180deg); }
.detail-card.reversed > * { transform: rotate(180deg); }
.detail-card .em { font-size: 60px; margin-bottom: 6px; }
.detail-card .nm-jp { font-size: 18px; font-weight: 800; color: #fff; }
.detail-card .nm-en { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 2px; font-style: italic; }
.detail-card .nm-num { font-size: 10px; color: rgba(251,191,36,0.7); position: absolute; top: 6px; left: 8px; font-family: system-ui, sans-serif; font-weight: 700; }

.tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: rgba(0,0,0,0.4);
    padding: 4px;
    border-radius: 10px;
}
.tab {
    flex: 1;
    padding: 8px;
    text-align: center;
    color: #a78bfa;
    border-radius: 7px;
    cursor: pointer;
    font-family: system-ui, sans-serif;
    font-size: 12px;
    font-weight: 700;

.tab.active.up { background: linear-gradient(135deg, rgba(251,191,36,0.25), rgba(245,158,11,0.15)); color: #fbbf24; }
.tab.active.rev { background: linear-gradient(135deg, rgba(248,113,113,0.25), rgba(220,38,38,0.15)); color: #f87171; }
.tab.active.both { background: linear-gradient(135deg, rgba(167,139,250,0.25), rgba(124,58,237,0.15)); color: #c4b5fd; }

.kw-row {

    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    justify-content: center;

.kw {
    background: rgba(251,191,36,0.15);
    border: 1px solid rgba(251,191,36,0.4);
    color: #fbbf24;
    padding: 4px 10px;
    border-radius: 14px;
    font-size: 12px;
    font-family: 'Hiragino Maru Gothic ProN', sans-serif;
    font-weight: 700;
}

.section {
    margin-bottom: 14px;
    padding: 12px 14px;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    border-left: 3px solid var(--accent, #a78bfa);

.section.up { --accent: #fbbf24; }
.section.rev { --accent: #f87171; }

.section-title {
    font-size: 11px;

}
.section-body {
    font-size: 14px;
    line-height: 1.7;
    color: #e6e3f0;
}
.cat-grid {

    gap: 8px;
    margin-top: 8px;
}
@media (max-width: 380px) { .cat-grid { grid-template-columns: 1fr; } }
.cat {
    background: rgba(0,0,0,0.3);
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(167,139,250,0.2);
}
.cat-label {
    font-size: 10px;
    color: #a78bfa;
    letter-spacing: 1.5px;
    font-family: system-ui, sans-serif;
    margin-bottom: 3px;
    font-weight: 700;
}
.cat-text {
    font-size: 13px;
    line-height: 1.5;
    color: #e6e3f0;
}
.advice {
    background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(245,158,11,0.1));
    border: 1px solid rgba(251,191,36,0.3);
    padding: 12px 14px;
    border-radius: 10px;
    margin-top: 12px;
}
.advice-label {
    font-size: 11px;
    color: #fbbf24;
    letter-spacing: 2px;

.advice-text {

    line-height: 1.6;
    color: #fef3c7;

.empty-msg {
    text-align: center;
    color: #6d7680;

    font-size: 14px;

.footer {

    text-align: center;
    color: #6d7680;
    font-size: 11px;

.footer a { color: #6d7680; text-decoration: none; }
</style>

// ───────── render ─────────
const grid = document.getElementById('grid');
const search = document.getElementById('search');
const filters = document.getElementById('filters');
let curFilter = 'all';
let curQuery = '';
let curMode = 'browse'; // browse / draw1 / draw3

function matches(card) {
    if (curFilter !== 'all' && card.st !== curFilter) return false;
    if (!curQuery) return true;
    const q = curQuery.toLowerCase();
    return card.n.includes(curQuery)
        || card.en.toLowerCase().includes(q)
        || card.kw.some(k => k.includes(curQuery));
}

function renderGrid() {
    grid.innerHTML = '';
    document.body.classList.remove('spread-mode');
    document.getElementById('spread-area').innerHTML = '';
    const list = CARDS.filter(matches);
    if (list.length === 0) {
        grid.innerHTML = '<div class="empty-msg">該当するカードが見つかりません</div>';
        return;
    }
    list.forEach(c => {
        const el = document.createElement('div');
        el.className = 'card';
        el.dataset.st = c.st;
        el.innerHTML = `
            <div class="no">${c.st === 'major' ? c.no : ''}</div>
            <div class="em">${c.em}</div>
            <div class="nm">${c.n}</div>`;
        el.addEventListener('click', () => openModal(c, false));
        grid.appendChild(el);
    });
}

// ───────── filter & search ─────────
filters.addEventListener('click', (e) => {
    const t = e.target.closest('.filt');
    if (!t) return;
    document.querySelectorAll('.filt').forEach(x => x.classList.toggle('active', x === t));
    curFilter = t.dataset.f;
    renderGrid();
});
search.addEventListener('input', () => {
    curQuery = search.value.trim();
    renderGrid();
});

// ───────── modal ─────────
const modal = document.getElementById('modal');
function setTabState(tab) {
    const up = document.getElementById('d-up');
    const rev = document.getElementById('d-rev');
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    if (tab === 'up') { up.style.display = ''; rev.style.display = 'none'; }
    else if (tab === 'rev') { up.style.display = 'none'; rev.style.display = ''; }
    else { up.style.display = ''; rev.style.display = ''; }
}
function openModal(c, reversed) {
    document.getElementById('d-card').dataset.st = c.st;
    document.getElementById('d-card').classList.toggle('reversed', !!reversed);
    document.getElementById('d-no').textContent = c.st === 'major' ? c.no : '';
    document.getElementById('d-em').textContent = c.em;
    document.getElementById('d-nm').textContent = c.n;
    document.getElementById('d-en').textContent = c.en;
    const kw = document.getElementById('d-kw');
    kw.innerHTML = '';
    c.kw.forEach(k => {
        const s = document.createElement('span');
        s.className = 'kw';
        s.textContent = k;
        kw.appendChild(s);
    });
    document.getElementById('d-u').textContent = c.u;
    document.getElementById('d-lu').textContent = c.lu;
    document.getElementById('d-wu').textContent = c.wu;
    document.getElementById('d-mu').textContent = c.mu;
    document.getElementById('d-hu').textContent = c.hu;
    document.getElementById('d-r').textContent = c.r;
    document.getElementById('d-lr').textContent = c.lr;
    document.getElementById('d-wr').textContent = c.wr;
    document.getElementById('d-mr').textContent = c.mr;
    document.getElementById('d-hr').textContent = c.hr;
    document.getElementById('d-ad').textContent = c.ad;

    setTabState(reversed ? 'rev' : 'both');
    modal.classList.add('show');
    document.getElementById('modal-inner').scrollTop = 0;
}
document.getElementById('close').addEventListener('click', () => modal.classList.remove('show'));
modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('show'); });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setTabState(t.dataset.tab)));

// ───────── draws ─────────
function drawCard() {
    const c = CARDS[Math.floor(Math.random() * CARDS.length)];
    const reversed = Math.random() < 0.5;
    return { c, reversed };
}

function showDraw(draws) {
    document.body.classList.add('spread-mode');
    const area = document.getElementById('spread-area');
    area.innerHTML = '';
    draws.forEach((d, i) => {
        const slot = document.createElement('div');
        slot.className = 'draw-slot';
        const label = draws.length === 3 ? ['過去', '現在', '未来'][i] : '今日のカード';
        slot.innerHTML = `<div class="pos-label">${label}</div>`;
        const card = document.createElement('div');
        card.className = 'draw-card' + (d.reversed ? ' reversed' : '');
        card.dataset.st = d.c.st;
        card.innerHTML = `
            ${d.reversed ? '<div class="rev-tag">逆位置</div>' : ''}
            <div class="no">${d.c.st === 'major' ? d.c.no : ''}</div>
            <div class="em">${d.c.em}</div>
            <div class="nm-jp">${d.c.n}</div>
            <div class="nm-en">${d.c.en}</div>`;
        card.addEventListener('click', () => openModal(d.c, d.reversed));
        slot.appendChild(card);
        area.appendChild(slot);
    });
    grid.innerHTML = '';
}

document.getElementById('draw1').addEventListener('click', () => {
    showDraw([drawCard()]);
});
document.getElementById('draw3').addEventListener('click', () => {
    const drawn = new Set();
    const draws = [];
    while (draws.length < 3) {
        const d = drawCard();
        if (drawn.has(d.c.n)) continue;
        drawn.add(d.c.n);
        draws.push(d);
    }
    showDraw(draws);
});
document.getElementById('show-all').addEventListener('click', () => {
    document.body.classList.remove('spread-mode');
    document.getElementById('spread-area').innerHTML = '';
    renderGrid();
});

// initial
renderGrid();
</script>
</body>
</html>
